name: Release-Linux

# Manual only. Dispatch this when you want a packaged Linux release: it builds the fork's Linux
# matrix in throwaway containers and attaches every artifact to a GitHub Release.
#
# Upstream's own releases are produced by ci-linux.yml + ci-release.yml; this is the fork's
# equivalent, limited to the lanes the Linux lineage actually changes (no Windows/macOS).
#
# All lanes are x86_64 and built with the CUDA toolkit (no --skip-cuda):
# scripts/install-cuda-redist.sh unpacks NVIDIA's redistributable archives into build/cuda and
# cmake takes that nvcc as CMAKE_CUDA_COMPILER, so the shipped
# binaries can build the CUDA encode device that consumes DMA-BUF/VRAM frames. A --skip-cuda
# build still compiles h264_nvenc/hevc_nvenc in, but it cannot build that device: on a host whose
# compositor renders on the NVIDIA GPU the DMA-BUF it then advertises has no CPU pointer and every
# frame fails to scale (the 2026.09.28 black screen), and a hybrid Intel+NVIDIA host silently
# loses the zero-copy route. Cost: ~4 GB runfile plus its install tree inside the workspace.
#
# The deb and rpm commands below are the same container recipes that produced, on the packaging
# host, sunshine_2026.10.02_amd64.deb (verify-sunshine-deb.sh: VERDICT OK — metadata, integration
# files and all six fix markers present) and Sunshine.rpm. Differences here: podman -> docker,
# no http_proxy (runners have clean network), and the source comes from a checkout of the tag
# instead of a local tree.
#
# Every lane carries the commit it was built from, in all three places that can hold it:
#   * COMMIT=<short sha> is exported at configure time, so PROJECT_VERSION_COMMIT is non-empty and
#     the binary's startup line reads "Sunshine version: <date version> commit: <sha>".
#     Without it that field ships empty (the fork's older packages all report "commit: ").
#   * the packages carry it in the field their format reserves for a rebuild identifier: the deb
#     revision (sunshine_<version>-<sha>_<arch>.deb) and the rpm release
#     (sunshine-<version>-<sha>.<arch>.rpm). PROJECT_VERSION itself stays the clean date version —
#     the AppStream metainfo and the /api/version endpoint are fed by it, so the commit does not
#     belong there (and rpmbuild rejects a "-" in the rpm version field anyway).
#   * the AppImage has no version field to attach a rebuild identifier to, so the commit rides in
#     the asset name and in the binary inside it.
#
# Each lane fails loudly if the commit did not make it into the package it just built.
#
# The release job derives dist/SHA256SUMS from whatever lanes succeeded and uploads it with the
# packages, so `sha256sum -c SHA256SUMS` works for anyone who downloads the assets.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (default: newest v<date>[.N]-linux tag by creation time)"
        required: false
        type: string
      version:
        description: "Package version (default: derived from the tag, e.g. 2026.09.26)"
        required: false
        type: string
      create_release:
        description: "Attach the artifacts to a GitHub Release"
        required: false
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release-linux
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.t.outputs.tag }}
      sha: ${{ steps.t.outputs.sha }}
      commit: ${{ steps.t.outputs.commit }}
      version: ${{ steps.t.outputs.version }}
    steps:
      - name: Pick the newest tag by real creation time
        id: t
        run: |
          set -euo pipefail
          FORK="${{ github.repository }}"
          TAG="${{ inputs.tag }}"
          # Names are not ordered by time (a same-day re-release carries a .N suffix, and a tag
          # created today may bear an earlier date), so sort by real tag creation date.
          rm -rf /tmp/fork-tags.git
          git clone --quiet --bare --filter=blob:none "https://github.com/$FORK.git" /tmp/fork-tags.git
          if [ -z "$TAG" ]; then
            TAG=$(git -C /tmp/fork-tags.git for-each-ref --sort=-creatordate \
                    --format='%(refname:short)' 'refs/tags/v*-linux' \
                  | grep -E '^v[0-9]{4}[.][0-9]{2}[.][0-9]{2}([.][0-9]+)?-linux$' | head -1)
          fi
          [ -n "$TAG" ] || { echo "no v<date>[-.N]-linux tag found in $FORK" >&2; exit 1; }
          SHA=$(git -C /tmp/fork-tags.git rev-list -n 1 "$TAG")
          # Eight digits, the width the release notes and the vault use for this repository.
          COMMIT=$(git -C /tmp/fork-tags.git rev-parse --short=8 "$TAG^{commit}")
          VERSION="${{ inputs.version }}"
          if [ -z "$VERSION" ]; then VERSION="${TAG#v}"; VERSION="${VERSION%-linux}"; fi
          echo "tag=$TAG sha=$SHA commit=$COMMIT version=$VERSION"
          { echo "tag=$TAG"; echo "sha=$SHA"; echo "commit=$COMMIT"; echo "version=$VERSION"; } \
            >> "$GITHUB_OUTPUT"

  deb:
    name: deb on ${{ matrix.slug }}
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ubuntu:22.04
            slug: ubuntu22.04
          - image: ubuntu:24.04
            slug: ubuntu24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve.outputs.tag }}
          submodules: recursive
      - name: Build
        env:
          IMAGE: ${{ matrix.image }}
          SLUG: ${{ matrix.slug }}
          BUILD_VERSION: ${{ needs.resolve.outputs.version }}
          COMMIT: ${{ needs.resolve.outputs.commit }}
        run: |
          set -euo pipefail
          C=fsl-deb
          docker rm -f "$C" >/dev/null 2>&1 || true
          docker run -d --name "$C" -v "$PWD:/src" -w /src "$IMAGE" sh -c 'mkdir -p /src; exec sleep infinity'
          docker exec -e DEBIAN_FRONTEND=noninteractive "$C" bash -lc '
            set -euo pipefail
            apt-get update -qq
            apt-get install -y -qq ca-certificates git curl wget xz-utils file cmake ninja-build
            git config --global --add safe.directory "*"
            # jammy ships cmake 3.22; the project wants >= 3.24 (its own target is 4.3.0)
            if ! cmake --version | head -1 | grep -qE "version (4|3\.2[4-9])"; then
              curl -fsSL -o /tmp/cmake.tar.gz https://github.com/Kitware/CMake/releases/download/v4.3.0/cmake-4.3.0-linux-x86_64.tar.gz
              tar -xzf /tmp/cmake.tar.gz -C /opt && rm -f /tmp/cmake.tar.gz
              for b in cmake ctest cpack; do ln -sf /opt/cmake-4.3.0-linux-x86_64/bin/$b /usr/local/bin/$b; done
            fi
            # the web UI needs Node >= 22; CMake bakes the ABSOLUTE npm path at configure time
            VER=$(curl -fsSL https://nodejs.org/dist/index.json | grep -o "\"version\":\"v22[^\"]*\"" | head -1 | cut -d\" -f4)
            curl -fsSL -o /tmp/node.tar.xz "https://nodejs.org/dist/${VER}/node-${VER}-linux-x64.tar.xz"
            rm -rf /opt/node22 && tar -xJf /tmp/node.tar.xz -C /opt && mv /opt/node-${VER}-linux-x64 /opt/node22 && rm -f /tmp/node.tar.xz
            for b in node npm npx; do ln -sf /opt/node22/bin/$b /usr/bin/$b; done
            echo "cmake $(cmake --version | head -1) / node $(node --version) / npm $(npm --version)"
          '
          # CUDA toolkit from NVIDIA's redistributable archives - see scripts/install-cuda-redist.sh
          # for why the monolithic runfile is not used (libxml2.so.2, ~8 GB inside the workspace).
          docker exec "$C" bash -lc 'cd /src && ./scripts/install-cuda-redist.sh'
          # Separate steps on purpose: one combined run hides which step failed.
          # COMMIT bakes the commit into the binary (PROJECT_VERSION_COMMIT); the deb revision is
          # DEBIAN_PACKAGE_RELEASE, which is what a `dpkg -l sunshine` prints after the version.
          for step in deps cmake build package; do
            docker exec -e DEBIAN_FRONTEND=noninteractive -e BRANCH=master -e BUILD_VERSION="$BUILD_VERSION" \
              -e COMMIT="$COMMIT" -e DEBIAN_PACKAGE_RELEASE="$COMMIT" \
              -e NODE_OPTIONS=--max-old-space-size=4096 "$C" bash -lc "
                export PATH=/opt/node22/bin:/usr/local/bin:\$PATH
                cd /src
                [ '$step' = cmake ] && rm -f build/CMakeCache.txt || true
                ./scripts/linux_build.sh --sudo-off --ubuntu-test-repo \
                  --num-processors=6 --step=$step > /tmp/deb-$step.log 2>&1
                echo step=$step exit=\$?
                grep -anE 'error:|FAILED|CMake Error|Cannot find module' /tmp/deb-$step.log | tail -5 || true
              "
          done
          DEB=$(docker exec "$C" bash -lc 'ls /src/build/cpack_artifacts/*.deb | head -1')
          # Gate on the packaged metadata, not on the build log: the deb version must name the
          # commit, otherwise this lane shipped the very defect it exists to fix.
          docker exec "$C" bash -lc "dpkg-deb -f '$DEB' Package Version Architecture"
          DEBVER=$(docker exec "$C" bash -lc "dpkg-deb -f '$DEB' Version")
          case "$DEBVER" in
            *"$COMMIT"*) echo "deb version '$DEBVER' carries commit $COMMIT" ;;
            *) echo "deb version '$DEBVER' does not carry commit $COMMIT" >&2; exit 1 ;;
          esac
          mkdir -p out && docker cp "$C:$DEB" "out/sunshine-${BUILD_VERSION}-${COMMIT}-${SLUG}_amd64.deb"
          docker exec "$C" bash -lc 'ls -l /src/build/cpack_artifacts/'
      - name: Attach the built packages
        uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.slug }}
          path: out/*.deb
          if-no-files-found: error

  rpm:
    name: rpm on fedora:44
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve.outputs.tag }}
          submodules: recursive
      - name: Build
        env:
          BUILD_VERSION: ${{ needs.resolve.outputs.version }}
          COMMIT: ${{ needs.resolve.outputs.commit }}
        run: |
          set -euo pipefail
          C=fsl-rpm
          docker rm -f "$C" >/dev/null 2>&1 || true
          docker run -d --name "$C" -v "$PWD:/src" -w /src fedora:44 sh -c 'mkdir -p /src; exec sleep infinity'
          docker exec "$C" bash -lc '
            set +e
            # fedora 44 ships gcc 16, and CUDA 13.x refuses host compilers newer than gcc 15
            # ("unsupported GNU version!"), so this lane builds with gcc 15 - the same choice the
            # Fedora spec makes for f44+ (packaging/linux/copr/Sunshine.spec: BuildRequires: gcc15).
            # --skip-unavailable keeps one unknown name from voiding the whole transaction.
            dnf install -y --skip-unavailable --setopt=install_weak_deps=False \
              appstream cmake desktop-file-utils doxygen gcc gcc-c++ gcc15 gcc15-c++ git glslc graphviz ImageMagick \
              libappstream-glib libcap-devel libcurl-devel libdrm-devel libevdev-devel libX11-devel \
              libxcb-devel libXcursor-devel libXfixes-devel libXi-devel libXinerama-devel libXrandr-devel \
              libXtst-devel mesa-libGL-devel mesa-libgbm-devel miniupnpc-devel ninja-build numactl-devel \
              openssl-devel opus-devel pipewire-devel pulseaudio-libs-devel python3-jinja2 qt6-qtbase-devel \
              qt6-qtsvg-devel rpm-build vulkan-loader-devel wget which xorg-x11-server-Xvfb boost-devel \
              boost-static libva-devel nodejs nodejs22 nodejs24 npm xz
            # both spellings: the build script asks for gcc-${gcc_version}, cmake for its own names
            G15=""; for c in gcc-15 gcc15; do p="$(command -v "$c" || true)"; if [ -n "$p" ]; then G15="$p"; break; fi; done
            GXX15=""; for c in g++-15 g++15; do p="$(command -v "$c" || true)"; if [ -n "$p" ]; then GXX15="$p"; break; fi; done
            if [ -z "$G15" ] || [ -z "$GXX15" ]; then echo "gcc 15 missing from this image:"; rpm -qa "gcc*"; exit 1; fi
            ln -sf "$G15" /usr/bin/gcc-15
            ln -sf "$G15" /usr/bin/gcc15
            ln -sf "$GXX15" /usr/bin/g++-15
            ln -sf "$GXX15" /usr/bin/g++15
            for c in gcc gcc-15 g++ g++-15 cmake ninja node npm rpmbuild; do printf "%-9s %s\n" "$c" "$(command -v $c || echo MISSING)"; done
          '
          # CUDA toolkit from NVIDIA's redistributable archives - see scripts/install-cuda-redist.sh
          # for why the monolithic runfile is not used (libxml2.so.2 is gone on fedora:44).
          docker exec "$C" bash -lc 'cd /src && ./scripts/install-cuda-redist.sh'
          # BRANCH=master + BUILD_VERSION put build_version.cmake on its CI path, so cpack's rpm
          # version is the release version. Without BRANCH it takes the git-describe path and the
          # rpm says 0.0.0-<sha> while the asset name says <version>. COMMIT also bakes the commit
          # into the binary, RPM_PACKAGE_RELEASE is the rpm rebuild identifier (its release field).
          for step in cmake build package; do
            docker exec -e BRANCH=master -e BUILD_VERSION="$BUILD_VERSION" -e COMMIT="$COMMIT" \
              -e RPM_PACKAGE_RELEASE="$COMMIT" -e NODE_OPTIONS=--max-old-space-size=4096 \
              "$C" bash -lc "
                cd /src
                [ '$step' = cmake ] && rm -f build/CMakeCache.txt || true
                ./scripts/linux_build.sh --cuda-patches --sudo-off --num-processors=6 --step=$step > /tmp/rpm-$step.log 2>&1
                echo step=$step exit=\$?
                grep -anE 'error:|FAILED|CMake Error|Cannot find module' /tmp/rpm-$step.log | tail -5 || true
              "
          done
          RPM=$(docker exec "$C" bash -lc 'ls /src/build/cpack_artifacts/*.rpm | head -1')
          # Gate on the rpm's own metadata: name-version-release must name both the version and the
          # commit. A release of "1" here means RPM_PACKAGE_RELEASE never reached cpack.
          docker exec "$C" bash -lc "rpm -qp --queryformat '%{NAME} %{VERSION} %{RELEASE}.%{ARCH}\n' '$RPM'"
          RPMVER=$(docker exec "$C" bash -lc "rpm -qp --queryformat '%{VERSION}-%{RELEASE}' '$RPM'")
          case "$RPMVER" in
            "$BUILD_VERSION-$COMMIT") echo "rpm version '$RPMVER' carries commit $COMMIT" ;;
            *) echo "rpm version '$RPMVER' is not $BUILD_VERSION-$COMMIT" >&2; exit 1 ;;
          esac
          mkdir -p out && docker cp "$C:$RPM" "out/sunshine-${BUILD_VERSION}-${COMMIT}.x86_64.rpm"
      - name: Attach the built packages
        uses: actions/upload-artifact@v4
        with:
          name: rpm
          path: out/*.rpm
          if-no-files-found: error

  appimage:
    name: AppImage
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve.outputs.tag }}
          submodules: recursive
      - name: Build
        env:
          BUILD_VERSION: ${{ needs.resolve.outputs.version }}
          COMMIT: ${{ needs.resolve.outputs.commit }}
        run: |
          set -euo pipefail
          C=fsl-ai
          docker rm -f "$C" >/dev/null 2>&1 || true
          docker run -d --name "$C" -v "$PWD:/src" -w /src ubuntu:22.04 sh -c 'mkdir -p /src; exec sleep infinity'
          docker exec -e DEBIAN_FRONTEND=noninteractive "$C" bash -lc '
            set -euo pipefail
            apt-get update -qq
            apt-get install -y -qq ca-certificates git curl wget xz-utils file cmake ninja-build libva-dev
            git config --global --add safe.directory "*"
            if ! cmake --version | head -1 | grep -qE "version (4|3\.2[4-9])"; then
              curl -fsSL -o /tmp/cmake.tar.gz https://github.com/Kitware/CMake/releases/download/v4.3.0/cmake-4.3.0-linux-x86_64.tar.gz
              tar -xzf /tmp/cmake.tar.gz -C /opt && rm -f /tmp/cmake.tar.gz
              for b in cmake ctest cpack; do ln -sf /opt/cmake-4.3.0-linux-x86_64/bin/$b /usr/local/bin/$b; done
            fi
            VER=$(curl -fsSL https://nodejs.org/dist/index.json | grep -o "\"version\":\"v22[^\"]*\"" | head -1 | cut -d\" -f4)
            curl -fsSL -o /tmp/node.tar.xz "https://nodejs.org/dist/${VER}/node-${VER}-linux-x64.tar.xz"
            rm -rf /opt/node22 && tar -xJf /tmp/node.tar.xz -C /opt && mv /opt/node-${VER}-linux-x64 /opt/node22 && rm -f /tmp/node.tar.xz
            for b in node npm npx; do ln -sf /opt/node22/bin/$b /usr/bin/$b; done
          '
          # CUDA toolkit from NVIDIA's redistributable archives - see scripts/install-cuda-redist.sh
          # for why the monolithic runfile is not used (libxml2.so.2, ~8 GB inside the workspace).
          docker exec "$C" bash -lc 'cd /src && ./scripts/install-cuda-redist.sh'
          for step in deps cmake build; do
            docker exec -e DEBIAN_FRONTEND=noninteractive -e BRANCH=master -e BUILD_VERSION="$BUILD_VERSION" \
              -e COMMIT="$COMMIT" -e NODE_OPTIONS=--max-old-space-size=4096 "$C" bash -lc "
                export PATH=/opt/node22/bin:/usr/local/bin:\$PATH
                cd /src
                [ '$step' = cmake ] && rm -f build/CMakeCache.txt || true
                ./scripts/linux_build.sh --sudo-off --ubuntu-test-repo --appimage-build \
                  --num-processors=6 --step=$step > /tmp/ai-$step.log 2>&1
                echo step=$step exit=\$?
                grep -anE 'error:|FAILED|CMake Error|Cannot find module' /tmp/ai-$step.log | tail -5 || true
              "
          done
          # linuxdeploy + the qt plugin, then the packaging step transcribed from the CI job
          docker exec -e APPIMAGE_EXTRACT_AND_RUN=1 "$C" bash -lc '
            set -euo pipefail
            # On Ubuntu /usr/bin/qmake is the qtchooser wrapper with no default Qt configured,
            # and linuxdeploy-plugin-qt then dies with:
            #   ERROR: Call to qmake failed: qmake: could not find a Qt installation of (empty)
            #   ERROR: Failed to query Qt paths using qmake -query
            #   ERROR: Failed to run plugin: qt (exit code: 1)
            # qt6-base-dev ships the real qmake; point the plugin at it explicitly. That is what
            # the fork own make-appimage.sh does, which is why packaging works locally.
            export QT_SELECT=qt6
            export EXTRA_QT_MODULES="svg;"
            # Do not guess the path: distros disagree on where Qt6 keeps qmake, and /usr/bin/qmake
            # may be the qtchooser wrapper with no default Qt at all. Accept only a qmake that can
            # actually answer -query, i.e. a real Qt installation.
            QMAKE=""
            for c in qmake6 /usr/lib/qt6/bin/qmake6 /usr/lib/qt6/bin/qmake \
                     /usr/lib/x86_64-linux-gnu/qt6/bin/qmake /usr/lib64/qt6/bin/qmake; do
              if command -v "$c" >/dev/null 2>&1 || [ -x "$c" ]; then
                p="$(command -v "$c" 2>/dev/null || echo "$c")"
                if "$p" -query QT_INSTALL_PLUGINS >/dev/null 2>&1; then QMAKE="$p"; break; fi
              fi
            done
            export QMAKE
            if [ -z "$QMAKE" ]; then
              echo "no usable qmake - dumping what is there so the next run can be fixed:"
              command -v qmake qmake6 || true
              ls -l /usr/lib/qt6/bin /usr/lib/x86_64-linux-gnu/qt6/bin 2>&1 || true
              dpkg -l | grep -E "qt6|qtchooser" | head -20 || true
              find /usr -maxdepth 5 -name "qmake*" 2>/dev/null | head -10 || true
              exit 1
            fi
            echo "using qmake: $QMAKE"
            "$QMAKE" -query QT_INSTALL_PLUGINS
            cd /src/build
            for i in 1 2 3 4 5; do
              [ -x linuxdeploy-x86_64.AppImage ] && break
              curl -fL --max-time 300 -o linuxdeploy-x86_64.AppImage \
                https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage && break
              echo "linuxdeploy: retry $i"; sleep 5
            done
            for i in 1 2 3 4 5; do
              [ -x linuxdeploy-plugin-qt-x86_64.AppImage ] && break
              curl -fL --max-time 300 -o linuxdeploy-plugin-qt-x86_64.AppImage \
                https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage && break
              echo "qt plugin: retry $i"; sleep 5
            done
            chmod +x linuxdeploy*.AppImage
            rm -rf AppDir && DESTDIR=AppDir ninja install
            cp -f ../packaging/linux/AppImage/AppRun ./AppDir/ && chmod +x ./AppDir/AppRun
            # `ninja install` puts the desktop file under usr/share/applications, while
            # linuxdeploy is handed AppDir/<id>.desktop - mirror what the fork own
            # make-appimage.sh does (which is why packaging works locally), and fail loudly if
            # neither source exists instead of letting linuxdeploy report a bare ENOENT.
            APP_ID=dev.lizardbyte.app.Sunshine
            if [ -f "./AppDir/usr/share/applications/${APP_ID}.desktop" ] && \
               [ ! "./AppDir/usr/share/applications/${APP_ID}.desktop" -ef "./AppDir/${APP_ID}.desktop" ]; then
              cp -f "./AppDir/usr/share/applications/${APP_ID}.desktop" ./AppDir/
            elif [ -f "../packaging/linux/AppImage/${APP_ID}.desktop" ]; then
              cp -f "../packaging/linux/AppImage/${APP_ID}.desktop" ./AppDir/
            fi
            ls ./AppDir/*.desktop >/dev/null 2>&1 || { echo no desktop file for the AppImage; ls -la ./AppDir | head -20; exit 1; }
            ./linuxdeploy-x86_64.AppImage --appdir ./AppDir --plugin qt \
              --executable ./sunshine --icon-file ../sunshine.png \
              --desktop-file "./AppDir/${APP_ID}.desktop" --output appimage
            ls -l Sunshine-*.AppImage
          '
          AI=$(docker exec "$C" bash -lc 'ls /src/build/Sunshine-*.AppImage | head -1')
          mkdir -p out && docker cp "$C:$AI" "out/Sunshine-${BUILD_VERSION}-${COMMIT}-x86_64.AppImage"
      - name: Verify the packaged binary really carries this build
        env:
          COMMIT: ${{ needs.resolve.outputs.commit }}
        run: |
          set -euo pipefail
          chmod +x out/*.AppImage
          ./out/*.AppImage --appimage-extract >/dev/null
          B=squashfs-root/usr/bin/sunshine
          missing=0
          for m in "codec context moved to" "handed to a running session" "after the compositor settled" "topology: mode=" "Virtual display [" "kscreen listing"; do
            n=$(grep -aFc -- "$m" "$B" || true)
            printf '%-32s %s\n' "$m" "${n:-0}"
            [ "${n:-0}" -gt 0 ] || missing=1
          done
          # The commit is a compile definition (PROJECT_VERSION_COMMIT): if the lane ever stops
          # exporting COMMIT, the binary reports "commit: " and this gate says so.
          n=$(grep -aFc -- "$COMMIT" "$B" || true)
          printf '%-32s %s\n' "commit $COMMIT" "${n:-0}"
          [ "${n:-0}" -gt 0 ] || { echo "the packaged binary does not carry commit $COMMIT"; missing=1; }
          [ "$missing" -eq 0 ] || { echo "artifact is stale: fix markers missing"; exit 1; }
      - name: Attach the built packages
        uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: out/*.AppImage
          if-no-files-found: error

  release:
    name: Publish the release
    needs: [resolve, deb, rpm, appimage]
    # Publish whatever succeeded: a single unhappy lane (e.g. an untested distro) must not
    # strand the artifacts that did build.
    if: ${{ !cancelled() && inputs.create_release }}
    runs-on: ubuntu-latest
    # This job has no checkout, so gh has no git remote to infer the repository from and dies with
    # "failed to run git: fatal: not a git repository" before it even reaches the API.
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
          if-no-files-found: ignore
      - name: Show what was collected
        run: ls -lR dist | head -40
      - name: Generate SHA256SUMS
        run: |
          set -euo pipefail
          cd dist
          rm -f SHA256SUMS
          shopt -s nullglob
          files=(*.deb *.rpm *.AppImage)
          [ ${#files[@]} -gt 0 ] || { echo "no packages were downloaded - nothing to publish" >&2; exit 1; }
          # Relative names: the assets land flat in the release, so a verifier can run
          #   sha256sum -c SHA256SUMS
          # in the directory it downloaded them into.
          sha256sum -- "${files[@]}" > SHA256SUMS
          cat SHA256SUMS
          { echo "### ${{ needs.resolve.outputs.tag }}"; echo; echo '```'; cat SHA256SUMS; echo '```'; } \
            >> "$GITHUB_STEP_SUMMARY"
          # Say out loud which lane produced nothing: a short release must not look complete.
          # (Match against the array, not `ls <glob>` - with nullglob a non-matching glob
          #  expands to nothing and a bare `ls` would silently succeed.)
          # The version/commit part of each name is checked by the lane that built it; here the
          # lane-specific tail is what tells the four expected assets apart.
          for expected in ubuntu22.04_amd64.deb ubuntu24.04_amd64.deb .x86_64.rpm x86_64.AppImage; do
            found=0
            for f in "${files[@]}"; do
              case "$f" in *"$expected") found=1; break ;; esac
            done
            [ "$found" -eq 1 ] || echo "::warning::no artifact matching *$expected (that lane failed)"
          done
      - name: Create the release and attach every artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" \
            --notes "Linux packages built from $TAG (commit ${{ needs.resolve.outputs.commit }}) by the Release-Linux workflow (deb x2, rpm, AppImage, x86_64, built with the CUDA toolkit). The commit is in the metadata of each package: the deb revision, the rpm release, and the AppImage binary, whose startup line reads 'Sunshine version: ... commit: ${{ needs.resolve.outputs.commit }}'."
          gh release upload "$TAG" dist/* --clobber
          gh release view "$TAG" --json assets --jq '.assets[].name'
      - name: Fill the checksums into the release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          gh release view "$TAG" --json body --jq .body > /tmp/release-body.md
          python3 - /tmp/release-body.md dist/SHA256SUMS <<'PY'
          # Put the hashes where the notes ask for them instead of leaving a placeholder:
          #   <!-- SHA256SUMS -->  -> replaced by a fenced block
          #   <构建完成后填入>      -> replaced by the bare lines (it already sits inside a fence)
          # No marker? Append a section - unless the notes already point at the asset.
          import pathlib
          import sys

          body_path, sums_path = (pathlib.Path(p) for p in sys.argv[1:3])
          body = body_path.read_text()
          sums = sums_path.read_text().rstrip("\n")
          marker, legacy = "<!-- SHA256SUMS -->", "<构建完成后填入>"
          if marker in body:
              body = body.replace(marker, "```\n" + sums + "\n```")
          elif legacy in body:
              body = body.replace(legacy, sums)
          elif "SHA256SUMS" in body:
              print("release notes already reference SHA256SUMS - left alone")
              raise SystemExit(0)
          else:
              body = body.rstrip("\n") + "\n\n## 校验（SHA256SUMS）\n\n```\n" + sums + "\n```\n"
          body_path.write_text(body)
          print("release notes updated with the checksums")
          PY
          gh release edit "$TAG" --notes-file /tmp/release-body.md
